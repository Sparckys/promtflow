<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>GuionFlow — Teleprompter</title>
  <link rel="stylesheet" href="prompter.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></symbol>
      <symbol id="i-rewind" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 5 6v5.5c0 4.3 2.9 7.7 7 9 4.1-1.3 7-4.7 7-9V6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m9 12 2.2 2.2L15.5 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-shield-off" viewBox="0 0 24 24"><path d="M12 3.5 5 6v5.5c0 4.3 2.9 7.7 7 9 4.1-1.3 7-4.7 7-9V6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M6 4l12 6.5-5.2 1.6L10.5 17z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m13 13 4.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-compact" viewBox="0 0 24 24"><path d="M4 9h16M4 15h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m9 4 3 3 3-3M9 20l3-3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.5s6 6.4 6 10.5a6 6 0 0 1-12 0c0-4.1 6-10.5 6-10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6.2 14h11.6" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-turtle" viewBox="0 0 24 24"><path d="M4 15c0-3.9 3.1-7 7-7s7 3.1 7 7H4z" fill="currentColor"/><circle cx="20" cy="13" r="2" fill="currentColor"/><path d="M6 15v2.5M15 15v2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-rabbit" viewBox="0 0 24 24"><ellipse cx="11" cy="15" rx="6.5" ry="4" fill="currentColor"/><circle cx="17.5" cy="11.5" r="2.6" fill="currentColor"/><path d="M17 9.5 15.5 3.5M18.6 9.3l1-5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div class="stage" id="stage">
    <!-- Barra superior (arrastrar para mover) -->
    <header class="bar top">
      <div class="sec-badge" id="secBadge">—</div>
      <div class="sec-name" id="secName"></div>
      <div class="clock">
        <span class="c-e">E <b id="tE">00:00</b></span>
        <span class="c-r">R <b id="tR">00:00</b></span>
      </div>
      <div class="spacer"></div>
      <button class="ib prot" id="bProt"><svg><use href="#i-shield"/></svg></button>
      <button class="ib" id="bCt" data-i18n-title="pClickThrough"><svg><use href="#i-cursor"/></svg></button>
      <button class="ib" id="bCompact" data-i18n-title="pCompact"><svg><use href="#i-compact"/></svg></button>
      <button class="ib" id="bMin" data-i18n-title="pMinimize"><svg><use href="#i-min"/></svg></button>
      <button class="ib close" id="bClose" data-i18n-title="pClose"><svg><use href="#i-x"/></svg></button>
    </header>

    <!-- Texto -->
    <div class="viewport" id="viewport">
      <div class="band" id="band"><i></i></div>
      <div class="content" id="content"></div>
      <div class="countdown" id="countdown" hidden></div>
      <div class="empty" id="empty" data-i18n="pEmpty" hidden></div>
      <div class="progress"><b id="progress"></b></div>
    </div>

    <!-- Controles -->
    <footer class="bar bottom">
      <button class="ib" data-cmd="prevSection" data-i18n-title="sc_prevSection"><svg><use href="#i-prev"/></svg></button>
      <button class="ib" data-cmd="back" data-i18n-title="pBack"><svg><use href="#i-rewind"/></svg></button>
      <button class="count" id="bCount" data-cmd="countdown"><b id="countNum">3</b></button>
      <button class="start" id="bStart" data-cmd="toggle"><svg><use href="#i-play"/></svg><span id="startLabel"></span></button>
      <button class="ib" data-cmd="nextSection" data-i18n-title="sc_nextSection"><svg><use href="#i-next"/></svg></button>
      <div class="speed">
        <svg class="sp-ico" data-i18n-title="pSlower"><use href="#i-turtle"/></svg>
        <input type="range" id="speed" min="0.25" max="10" step="0.25" />
        <svg class="sp-ico" data-i18n-title="pFaster"><use href="#i-rabbit"/></svg>
        <b id="speedVal">3x</b>
      </div>
      <div class="spacer"></div>
      <div class="fontbtns">
        <button class="ib txt" data-cmd="fontDown" data-i18n-title="pFontDown">A<small>−</small></button>
        <button class="ib txt" data-cmd="fontUp" data-i18n-title="pFontUp">A<small>+</small></button>
      </div>
      <div class="opacity" data-i18n-title="pOpacity">
        <svg><use href="#i-drop"/></svg>
        <input type="range" id="opacity" min="0" max="1" step="0.05" />
      </div>
    </footer>

    <div class="ct-badge" id="ctBadge"></div>
    <div class="grip" id="grip" data-i18n-title="pResize"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="parser.js"></script>
  <script src="prompter.js"></script>
</body>
</html>
